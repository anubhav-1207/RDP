name: RDP

on:
  workflow_dispatch:

jobs:
  secure-rdp:
    runs-on: windows-latest
    timeout-minutes: 3600

    steps:
      - name: Configure Core RDP Settings
        run: |
          # Enable Remote Desktop and disable Network Level Authentication (if needed)
          Set-ItemProperty -Path 'HKLM:SystemCurrentControlSetControlTerminal Server' `
                             -Name "fDenyTSConnections" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:SystemCurrentControlSetControlTerminal ServerWinStationsRDP-Tcp' `
                             -Name "UserAuthentication" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:SystemCurrentControlSetControlTerminal ServerWinStationsRDP-Tcp' `
                             -Name "SecurityLayer" -Value 0 -Force

          # Remove any existing rule with the same name to avoid duplication
          netsh advfirewall firewall delete rule name="RDP-Tailscale" | Out-Null
          
          # Allow incoming connections on port 3389
          netsh advfirewall firewall add rule name="RDP-Tailscale" `
            dir=in action=allow protocol=TCP localport=3389 | Out-Null

          # Restart the Remote Desktop service to ensure changes take effect
          Restart-Service -Name TermService -Force

      - name: Create RDP User with Fixed Password
        run: |
          # ===== EDIT THIS: your fixed RDP password =====
          $password = "MyFixedRDP#Pass123"
          # ==============================================

          $securePass = ConvertTo-SecureString $password -AsPlainText -Force

          # Remove existing user if present (optional but clean)
          if (Get-LocalUser -Name "RDP" -ErrorAction SilentlyContinue) {
              Remove-LocalUser -Name "RDP" -Force
          }

          New-LocalUser -Name "RDP" -Password $securePass -AccountNeverExpires
          Add-LocalGroupMember -Group "Administrators" -Member "RDP"
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "RDP"

          echo "RDP_CREDS=User: RDP | Password: $password" >> $env:GITHUB_ENV

          if (-not (Get-LocalUser -Name "RDP")) {
              Write-Error "User creation failed"
              exit 1
          }

      - name: Install Tailscale
        run: |
          $tsUrl = "https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi"
          $installerPath = "$env:TEMP\tailscale.msi"
          
          Invoke-WebRequest -Uri $tsUrl -OutFile $installerPath
          Start-Process msiexec.exe -ArgumentList "/i", "`"$installerPath`"", "/quiet", "/norestart" -Wait
          Remove-Item $installerPath -Force

      - name: Establish Tailscale Connection
        run: |
          # ===== EDIT THIS: your Tailscale auth key =====
          $authKey = "tskey-auth-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"
          # ==============================================

          # Bring up Tailscale with the provided auth key and set a unique hostname
          & "$env:ProgramFilesTailscale\tailscale.exe" up --authkey=$authKey --hostname=gh-runner-$env:GITHUB_RUN_ID
          
          # Wait for Tailscale to assign an IP
          $tsIP = $null
          $retries = 0
          while (-not $tsIP -and $retries -lt 10) {
              $tsIP = & "$env:ProgramFilesTailscale\tailscale.exe" ip -4
              Start-Sleep -Seconds 5
              $retries++
          }
          
          if (-not $tsIP) {
              Write-Error "Tailscale IP not assigned. Exiting."
              exit 1
          }
          echo "TAILSCALE_IP=$tsIP" >> $env:GITHUB_ENV
      
      - name: Install Visual Studio Code
        run: |
          # Download VS Code user installer (stable, 64-bit)
          $vscodeUrl = "https://update.code.visualstudio.com/latest/win32-x64-user/stable"
          $vscodeInstaller = "$env:TEMPVSCodeSetup.exe"

          Invoke-WebRequest -Uri $vscodeUrl -OutFile $vscodeInstaller

          # Silent install:
          # /verysilent – no UI
          # /norestart – don’t restart
          # /mergetasks=!runcode – don’t launch VS Code after install
          Start-Process -FilePath $vscodeInstaller `
            -ArgumentList "/verysilent", "/norestart", "/mergetasks=!runcode" `
            -Wait

          $vscodePath = "$env:LOCALAPPDATAProgramsMicrosoft VS CodeCode.exe"

          if (-not (Test-Path $vscodePath)) {
              Write-Error "Visual Studio Code installation failed"
              exit 1
          }

          Write-Host "Visual Studio Code installed at: $vscodePath"

          # Optional: install some common extensions
          $codeCli = "$env:LOCALAPPDATAProgramsMicrosoft VS Code\bincode.cmd"
          if (Test-Path $codeCli) {
            & $codeCli --install-extension ms-vscode-remote.remote-explorer | Out-Null
            & $codeCli --install-extension ms-vscode-remote.remote-wsl | Out-Null
          }

          # Cleanup installer
          Remove-Item $vscodeInstaller -Force

      - name: Verify RDP Accessibility
        run: |
          Write-Host "Tailscale IP: $env:TAILSCALE_IP"
          
          # Test connectivity using Test-NetConnection against the Tailscale IP on port 3389
          $testResult = Test-NetConnection -ComputerName $env:TAILSCALE_IP -Port 3389
          if (-not $testResult.TcpTestSucceeded) {
              Write-Error "TCP connection to RDP port 3389 failed"
              exit 1
          }
          Write-Host "TCP connectivity successful!"

      - name: Maintain Connection
        run: |
          Write-Host "`n=== RDP ACCESS ==="
          Write-Host "Address:  $env:TAILSCALE_IP"
          Write-Host "Username: RDP"
          Write-Host "Password: $(echo $env:RDP_CREDS)"
          Write-Host "VS Code:  $env:LOCALAPPDATAProgramsMicrosoft VS CodeCode.exe"
          Write-Host "==================`n"
          
          # Keep runner active indefinitely (or until manually cancelled / timeout)
          while ($true) {
              Write-Host "[$(Get-Date)] RDP Active - Use Ctrl+C in workflow to terminate"
              Start-Sleep -Seconds 300
          }
