name: RDP

on:
  workflow_dispatch:

jobs:
  secure-rdp:
    runs-on: macos-latest
    timeout-minutes: 3600

    steps:
      - name: Enable Remote Desktop
        run: |
          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart -activate -configure -access -on -users _unknown -privs -all -restart -agent -console

      - name: Create RDP User
        run: |
          sudo dscl . -create /Users/rdpuser
          sudo dscl . -create /Users/rdpuser UserShell /bin/bash
          sudo dscl . -create /Users/rdpuser RealName "RDP User"
          sudo dscl . -create /Users/rdpuser UniqueID 501
          sudo dscl . -create /Users/rdpuser PrimaryGroupID 20
          sudo dscl . -create /Users/rdpuser NFSHomeDirectory /Users/rdpuser
          sudo mkdir -p /Users/rdpuser
          sudo chown -R rdpuser:staff /Users/rdpuser
          
          # Set password
          echo "rdpuser:Md2@Secure" | sudo chpasswd

      - name: Grant Remote Desktop Access
        run: |
          sudo dseditgroup -o edit -a rdpuser -t user com.apple.access_remote_ae

      - name: Configure Firewall
        run: |
          sudo /usr/libexec/ApplicationFirewall/socketfilterfw --setglobalstate off

      - name: Install Tailscale
        run: |
          brew install tailscale

      - name: Establish Tailscale Connection with MagicDNS
        run: |
          sudo tailscale up --authkey=${{ secrets.TAILSCALE_AUTH_KEY }} --hostname=macos-remote-desktop
          
          # Wait for Tailscale IP
          sleep 10
          TAILSCALE_IP=$(tailscale ip -4)
          echo "TAILSCALE_IP=$TAILSCALE_IP" >> $GITHUB_ENV

      - name: Verify Remote Desktop Accessibility
        run: |
          # Check if ARD listening on port 3283
          netstat -an | grep 3283 || echo "ARD not yet listening"

      - name: Display Access Information
        run: |
          echo "=== MACOS REMOTE DESKTOP ACCESS ==="
          echo "Address: macos-remote-desktop.tail[TAILNET_NAME].ts.net"
          echo "Username: rdpuser"
          echo "Password: Md2@Secure"
          echo "IP: $TAILSCALE_IP"
          echo "Port: 3283 (built-in)"
          echo "======================================="

      - name: Keep Connection Active
        run: |
          while true; do
              echo "[$(date)] macOS Remote Desktop Active - Use Ctrl+C to terminate"
              sleep 300
          done
